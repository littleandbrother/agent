name: BF V2 regression

on:
  pull_request:
    branches: [codex/bf-design-lab-r0-r2-20261011, codex/bf-architecture-v2]
  push:
    branches: [codex/bf-architecture-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bf-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned numerical and PDF dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/bf-v2-python"
          "$RUNNER_TEMP/bf-v2-python/bin/python" -m pip install -r battery-world/configs/ci/requirements-v2.txt
          echo "$RUNNER_TEMP/bf-v2-python/bin" >> "$GITHUB_PATH"
      - name: Repository source, recovery, invalidation and exact reuse
        working-directory: battery-world
        env:
          BF_RUNTIME_ROOT: ${{ runner.temp }}/bf-v2-unit
          BFWORLD_PYTHON: python3
          BFWORLD_VERIFY_PROFILE: architecture-v2-ci
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: packages/python/bfworld/src:tests/agentlab
        run: ./init.sh
      - name: Five-stage campaign and bounded storage regression
        working-directory: battery-world
        env:
          BF_RUNTIME_ROOT: ${{ runner.temp }}/bf-v2-unit
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: packages/python/bfworld/src:tests/agentlab
        run: |
          python3 -m unittest discover -s tests/agentlab -p 'test_campaign*.py' -v
          python3 -m unittest discover -s tests/agentlab -p 'test_storage.py' -v
          python3 -m unittest discover -s tests/agentlab -p 'test_abc_*.py' -v

  publication-reproduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify published source and reproduce paper results from saved data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 release/verify_source.py --manifest release/abc-20261020/source-manifest.json
          python3 battery-world/papers/method-reexecution-20261019/final/reproduce.py --output "$RUNNER_TEMP/bf-method-results" --negative-controls
          python3 battery-world/papers/interface-sufficiency-20261019/final/E_reproduce.py --output "$RUNNER_TEMP/bf-interface-results"

  pi-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pi-bf-aiot/package-lock.json
      - name: Install pinned dependencies
        working-directory: pi-bf-aiot
        run: npm ci --ignore-scripts
      - name: Offline SDK and BF transport build
        working-directory: pi-bf-aiot
        run: npm run bf:build
      - name: Types, transport, dependency and browser checks
        working-directory: pi-bf-aiot
        run: npm run check
      - name: Reject check-generated source changes
        run: git diff --exit-code
