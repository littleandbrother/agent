<text x="381" y="366" font-size="18" font-weight="bold">PGOOD lost during SAMPLE or TX</text>
<text x="381" y="396" font-size="15" font-weight="normal">On the next wake: cancel window and stop active advertising</text>
<text x="381" y="421" font-size="15" font-weight="normal">Mark skipped / aborted; PH_IDLE; advance exactly one period</text>
<text x="381" y="446" font-size="15" font-weight="normal">Detection depends on wake-up; hardware latency unmeasured</text>
