<text x="35" y="515" font-size="19" font-weight="normal">Admission wait: PGOOD GPIO sense and 250 ms probe; sleep with sd_app_evt_wait().</text>
<text x="35" y="548" font-size="19" font-weight="normal">Actual BLE event duration differs from the host reference TX window; advertising start is not receiver delivery.</text>
<text x="35" y="581" font-size="18" font-weight="normal">Source: target-source/main.c, lines 93-100, 392-474, 513-569. SHA-256 bound in target-control-flow.json.</text>
