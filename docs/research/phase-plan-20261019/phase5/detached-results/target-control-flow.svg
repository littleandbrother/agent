<text x="35" y="37" font-size="28" font-weight="bold">nRF52832 target control flow</text>
<text x="35" y="68" font-size="19" font-weight="normal">Saved source; configured bounds only. Hardware and RF timing remain unmeasured.</text>
<rect x="35" y="102" width="285" height="135" rx="8" fill="#edf4f9" stroke="#7995aa"/>
<text x="51" y="133" font-size="18" font-weight="bold">Initialize / re-admit</text>
<text x="51" y="163" font-size="15" font-weight="normal">Stack, timer, SAADC, advertising</text>
<text x="51" y="188" font-size="15" font-weight="normal">On reset: no NVM state</text>
<text x="51" y="213" font-size="15" font-weight="normal">PGOOD and VDD &gt;= 2300 mV</text>
<rect x="365" y="102" width="275" height="135" rx="8" fill="#edf4f9" stroke="#7995aa"/>
<text x="381" y="133" font-size="18" font-weight="bold">PH_IDLE: scheduled slot</text>
<text x="381" y="163" font-size="15" font-weight="normal">First slot: +1500 ms</text>
<text x="381" y="188" font-size="15" font-weight="normal">seq++; sample temperature</text>
<text x="381" y="213" font-size="15" font-weight="normal">Read VDD; set status flags</text>
<rect x="685" y="102" width="245" height="135" rx="8" fill="#edf4f9" stroke="#7995aa"/>
<text x="701" y="133" font-size="18" font-weight="bold">PH_SAMPLE</text>
<text x="701" y="163" font-size="15" font-weight="normal">Window: 11 ms from slot</text>
<text x="701" y="188" font-size="15" font-weight="normal">Build payload: seq, value, CRC</text>
<text x="701" y="213" font-size="15" font-weight="normal">Service threshold: 2200 mV</text>
<rect x="975" y="102" width="290" height="135" rx="8" fill="#edf4f9" stroke="#7995aa"/>
<text x="991" y="133" font-size="18" font-weight="bold">PH_TX</text>
<text x="991" y="163" font-size="15" font-weight="normal">Start only with supply flags clear</text>
<text x="991" y="188" font-size="15" font-weight="normal">One advertising event</text>
<text x="991" y="213" font-size="15" font-weight="normal">Completion event or 40 ms bound</text>
