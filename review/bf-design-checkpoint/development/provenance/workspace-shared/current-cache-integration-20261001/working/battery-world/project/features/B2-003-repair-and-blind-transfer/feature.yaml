schema_version: battery-world-feature-v1
id: B2-003-repair-and-blind-transfer
status: ready
execution_paused_for: BFA-001-pi-workbench
execution_pause_reason: User requested the separate Pi engineering chain; formal B2 dispatch remains subject to its original owner gates.
owner: coordinator
objective: Mechanically check and repair generated candidates before scientific qualification, then evaluate activated executable knowledge on a new sealed task family.
owned_paths: [packages/python/bfworld/src/bfworld/campaign/, packages/python/bfworld/src/bfworld/knowledge/, packages/python/bfworld/src/bfworld/coupled/profiled.py, packages/python/bfworld/src/bfworld/coupled/profiled_artifacts.py, scripts/, tests/campaign/, tests/knowledge/, studies/, docs/, project/, PROJECT.yaml, apps/world-studio/]
hypothesis: Explicit syntax/schema/scope feedback reduces invalid candidates; a qualified module improves new-task design beyond increasing evidence requests.
falsifier: Candidate remains invalid, treatment does not activate, transfer gain is absent, budget/information parity fails, or the result uses observed final tasks as blind tests.
schema_changes: [candidate-compile-and-repair-v1, blind-transfer-campaign-v2, coupled-profiled-reference-v2, profiled-predictor-context-v2, public-profiled-development-v1, measured-artifact-import-v1]
tests: [mechanical repair stop, syntax failure, output schema, no-op control, new task identity, immutable old report, treatment activation, total cost attribution]
negative_controls: [invalid Python, truncated JSON, out-of-scope input, no feasible design, no revision needed, knowledge removal, unqualified candidate]
exit_gates: [bounded mechanical feedback, program executes before qualification, separate model and workflow qualification, genuinely new sealed family, activated raw/text/code conditions, local and paid cost ledger, blind transfer and removal]
command: .venv/bin/python scripts/build_b2_development.py && ./init.sh && node apps/world-studio/development-test.mjs
artifacts: [new protocol and implementation hash before dispatch, repair traces, new held-out receipt, attribution and cost report]
cost_cap: Shared original ledger; user CNY 2 per trial and total strictly below CNY 20. Already accounted CNY 1.463445 upper bound and 463487 tokens. Never reset the ledger or silently extend a stopped engineering envelope.
claim_boundary: Previous 36 trials are a completed finite-catalogue pilot with all three knowledge candidates rejected; not transfer, an effective factorial or RSI.
stop_condition: Repair budget reached, hidden-final reuse, inactive treatment, no transfer gain, shared budget exhausted, or unavailable required physical evidence.
handoff: Positive independently validated transfer is needed for research C1; physical confirmation remains C2.
limitations: [new protocol required, previous final tasks are now observed, continuous-space task diversity and local CPU accounting remain open]
scientific_purpose: Diagnose erroneous feasible-space pruning before attempting a new knowledge-transfer claim.
central_claim: >-
  In cross-domain coupled BF AIoT design, local experience can incorrectly prune
  feasible designs. We study whether a general coding Agent can use independent
  experiments to revise scoped executable judgments, reducing future equal-budget
  trial and error without increasing false admission.
current_delivery_scope:
  - Offline candidate compiler and bounded repair callback, no paid dispatch.
  - G2 structured development counterexamples and controlled interventions.
  - Separately bound world-model and workflow qualification receipts.
  - Explicit task/split identities and fail-closed protocol readiness checks.
  - Trace-bound counterexample inspector, not new 3D scenes.
  - Versioned typed load-profile execution and explicit development/regression task materialization; frozen v1 untouched.
  - Detached diagnostic program revisions and equal-order use/removal/transplant harness; engineering evidence remains distinct from model experiments.
  - Read-only measured asset import with verified source identities, explicit measurement boundary and no fabricated alignment.
  - Receipt-reconciled real-provider repair adapter and scientific qualification executor, tested only with isolated unpaid fixtures until an owner-approved protocol exists.
  - Separate semantic proposal adapter using the original ledger, typed public history and independent world/workflow triage; no actual generation dispatched.
  - Matched five-condition execution core and inspectable scripted trial bundle, including Raw Python and post-freeze confirmation; not a formal Agent experiment.
  - Provider-backed v2 matched execution, per-turn settlement reconciliation, durable effects, post-freeze confirmation and a preflight/execute/read-only-recovery CLI; validated with isolated test transport only.
  - Independent scoped workflow use qualification over sealed observations, including simple-ordering public controls and an unapproved concrete owner-review protocol.
paused_work: [new deployment scenes, old-protocol paid expansion, base-model replacement, open-ended harness self-modification]
trust_boundary: Candidate code cannot alter reference truth, compiler policy, qualification thresholds, splits, blind tasks, budget or evidence identities.
protocol_control: New formal splits, thresholds, baselines, budget, success metric and statistical unit require an explicit owner-approved protocol; this implementation prepares a draft, never ratifies it.
mechanical_repair_limit: {max_repairs: 2, max_attempts: 3, identical_candidate: stop, scientific_calls_before_mechanical_pass: 0}
local_cost_cap: No provider calls; local diagnostic execution only, with measured wall and parent/child CPU receipts. Historical cost is not retroactively reconstructed.
acceptance_tests: [AST danger and signature checks, malformed and domain abstention, bounded repair and replay, duplicate task physics rejection, blind feedback denial, world/workflow receipt independence, immutable pilot identity, source-bound Studio diagnostics]
continuation_contract:
  purpose: Close the actual provider-to-candidate recovery gap and execute separately bound explanation/use/regression/scope decisions under a supplied protocol.
  hypothesis: A settled provider response can survive a process crash without a second paid effect, and mechanical success cannot bypass scientific or protocol rejection.
  falsifier: Duplicate dispatch, detached or fabricated cost receipt, identity drift, missing-cost promotion, hidden feedback leakage, or qualification using unfrozen thresholds.
  schemas: [provider-repair-bridge-v1, scientific-qualification-execution-v1]
  negative_controls: [settled-before-candidate crash, reserved-unknown crash, model fingerprint drift, malformed or truncated model output, wrong shared ledger, expired window, stale compiler, false feasibility, all abstain, lost solvability, blind feedback, missing local cost]
  outputs: [adapter transaction receipts, mechanical repair result, separate qualification facts, zero-provider control report]
  command: PYTHONPATH=packages/python/bfworld/src .venv/bin/python -m unittest discover -s tests/campaign -p 'test_b2*.py' -v
  stop: No actual provider dispatch without exact owner-approved protocol and shared original budget; no scientific promotion from engineering fixtures.
matched_trial_contract:
  purpose: Execute explicit-context trials with common history and tools, nonempty text lessons, measured code activation and experiment-bound submissions; freeze all trials before confirmation.
  hypothesis: Arm differences can be confined to the declared knowledge intervention while the same agent action interface retains evidence and cost identity.
  falsifier: Empty lesson, unexecuted code treatment, hidden outcome in prompts, history or tool inequality, submission bound to another task, duplicate callback after interruption, or fixture reported as Agent benefit.
  owned_paths: [packages/python/bfworld/src/bfworld/campaign/, tests/campaign/, scripts/, studies/, docs/, project/]
  schemas: [matched-agent-trials-v1, semantic-proposal-request-v1]
  tests: [equal context and tools, raw arm Python execution, inactive qualified arm denial, stale evidence denial, no-solution abstention, final barrier, replay without new calls, interrupted unknown callback stop]
  negative_controls: [empty memory, all-abstain program, false submission, mismatched history, blind generation feedback, engineering promotion]
  output: source-bound matched trial traces and control report; no fabricated G3 or transfer result
  cost_cap: Unpaid local controls only until an owner-approved protocol binds actual dispatch; original ledger unchanged.
  stop: Do not launch live trial calls or claim transfer from a scripted decision callback.
live_decision_contract:
  purpose: Connect exact participant transcripts to the original provider ledger and resume settled decisions without repeating paid or completed local effects.
  hypothesis: A matched trial can use actual provider decisions with the same public interface, independently qualified treatment, outcome-blind final barrier and usage-bound accounting.
  falsifier: Extra dispatch on replay, changed transcript or budget, hidden confirmation before barrier, fake transport marked real, engineering qualification accepted formally, or missing crash cost reported complete.
  schemas: [matched-provider-trials-v2, provider-decision-bridge-v1]
  owned_paths: [packages/python/bfworld/src/bfworld/campaign/, tests/campaign/, scripts/, studies/, docs/, project/]
  tests: [settled-decision recovery, reserved-unknown stop, effect replay, transcript tamper, fake-versus-real provenance, qualified-treatment binding, final barrier, draft preflight before key access]
  negative_controls: [expired window, wrong fingerprint, changed trial ID, unqualified capsule, malformed model action, missing usage, unresolved local effect, missing historical costs]
  cost_cap: Original shared ledger and all existing caps retained; local isolated fake-transport tests only until owner approval.
  output: receipt-bound provider decision adapter, recoverable trial/matrix execution and reproducible controls; no implied positive transfer
  stop: No real dispatch under a draft protocol, no hidden task creation/approval by the participant, and no promotion with missing scientific or cost evidence.
demo: Inspect the rejected G2 feasibility boundary, lost solvable candidates, factual intervention results and explicitly unresolved explanations in the existing Studio.
workflow_use_contract:
  purpose: Evaluate scoped declarative experiment ordering independently of world-model acceptance, using exact sealed reference observations.
  hypothesis: Evidence-safe ordering can reduce deterministic catalogue probes while retaining solvability, regression efficiency and explicit out-of-scope abstention.
  falsifier: No gain, a lost solvable task, regression ceiling exceeded, unverifiable or misbound observation, out-of-scope execution, or engineering controls promoted as learned knowledge.
  schemas: [scoped-workflow-v1, workflow-use-qualification-v1]
  owned_paths: [packages/python/bfworld/src/bfworld/campaign/, tests/campaign/, scripts/, studies/, docs/, project/]
  tests: [independent workflow use, no-gain control, scope rejection, regression loss, exact run binding, order invariance, immutable replay, formal protocol denial]
  negative_controls: [rejected world model, same ordering as baseline, all-infeasible catalogue, missing or altered evidence, empty scope, incomplete acquisition cost]
  cost_cap: Reuse public sealed observations; zero paid calls and no new blind set. Separate reference acquisition cost from replayed policy probes.
  output: Scoped workflow use report and concrete unapproved owner-review protocol, not an Agent or factorial result.
  stop: Formal qualification requires owner-bound plan, task, candidate, thresholds, baseline and cost receipts; no author-created approval.
