[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bfworld"
version = "0.1.0"
description = "Evidence-governed executable battery-free world kernel"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema==4.23.0",
  "pyarrow==22.0.0",
  "PyYAML==6.0.2",
]

[project.scripts]
bfworld = "bfworld.cli:main"

[tool.setuptools]
package-dir = {"" = "packages/python/bfworld/src"}

[tool.setuptools.packages.find]
where = ["packages/python/bfworld/src"]

