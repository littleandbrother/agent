schema_version: battery-world-project-v1
project: battery-world
product: Battery World Studio
method: EpiDesign
central_scientific_question: >-
  Can a fixed general-purpose coding agent convert the cost of past experiments
  into executable, verifiable, and transferable knowledge that reduces trial
  and error and expands capability on future scientific design tasks?
phase: b2-agent-execution-and-qualification-preparation
active_feature: null
previous_active_feature: BFA-071-paper-and-project-publication
next_milestone: B2-003-repair-and-blind-transfer
contract_version: v1
release: 0.1.0-a1
engineering_delivery: [trace-bound offline 3D Studio, coupled computational missions, durable local experiment control, executable knowledge qualification and rejection, guided transfer study, source-bound digital product package, version-bound engineering delivery inventory, product-node deliverable previews and reference-board separation, native COMSOL and vendor LTspice reference simulations, Pi-authored product revision acceptance with recorded review, archive-backed long-session context recovery, lease-bound graceful Pi pause and resume, exact-file delivery recovery, version-bound MCU firmware and TinyML NAS artifacts, source-bound research checkpoints and isolated mechanism pilots with retained negative results]
authorities:
  project_state: PROJECT.yaml
  feature_state: project/features
  research_roadmap: project/ROADMAP.yaml
  human_progress_view: docs/PROGRESS.md
  wire_contracts: contracts/schemas
  scientific_trace: LiveRun/events.jsonl
  portable_evidence: RunBundle/bundle-seal.json
claim_boundary: >-
  A validates a deterministic F1-simplified Rotary-TENG computational world,
  trace/replay, recovery, and independent bundle verification. B0-000 validates
  deterministic semantic fixtures for authority separation, event order,
  PMP/EA/VMS, energy accounting, and visual provenance. Neither validates
  hardware, Agent efficacy, DSH benefit, or RSI.

