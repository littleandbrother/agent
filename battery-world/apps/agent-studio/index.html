<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BF Agent · 对话</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/developer.css"><link rel="stylesheet" href="/trace.css"><link rel="stylesheet" href="/chat.css"><link rel="stylesheet" href="/organization.css"><link rel="stylesheet" href="/product.css"><link rel="stylesheet" href="/conversation.css"><link rel="stylesheet" href="/console.css"><link rel="stylesheet" href="/panorama.css"><link rel="stylesheet" href="/research.css"><link rel="stylesheet" href="/product-workspace.css"><link rel="stylesheet" href="/product-results.css"></head>
<body><div class="shell"><aside id="session-sidebar" class="sidebar" aria-label="会话侧栏"><a class="brand" href="/">bƒ <span>BF Agent</span></a><div class="sidebar-create"><button id="new-chat" class="new-chat">＋ 新对话</button><button id="new-folder" class="quiet" title="新建文件夹" aria-label="新建文件夹">⊞</button></div><div class="sidebar-scroll"><div id="folder-tree" aria-label="文件夹"></div><nav id="sessions" aria-label="任务会话"></nav><details id="history-list"><summary>历史实验会话</summary><nav id="legacy-sessions" aria-label="历史会话"></nav></details></div><div class="sidebar-bottom"><div class="mode-switch" aria-label="工作台模式"><button id="runtime-mode" aria-pressed="true">任务</button><button id="developer-mode" aria-pressed="false">控制台</button><button id="panorama-mode" aria-pressed="false">全景</button><button id="product-mode" aria-pressed="false">产品</button></div><button id="open-trash" class="quiet">最近删除</button><span id="connection">连接中</span><button id="refresh" class="quiet">刷新</button></div></aside>
<main><header class="topbar"><button id="sidebar-toggle" class="icon-button" aria-controls="session-sidebar" aria-expanded="true" aria-label="收起左侧栏" title="收起左侧栏">☰</button><span id="conversation-title">新对话</span><span id="conversation-status" class="muted"></span><button id="folder-context" class="quiet" hidden></button><button id="sections-toggle" class="quiet" aria-controls="section-inspector" aria-expanded="true">方案与文件</button></header><div class="app-body"><section id="chat-main" class="chat-main is-empty"><div id="conversation" class="conversation" aria-label="任务对话" aria-live="polite"></div><div class="composer-wrap"><h1 id="welcome">你想解决什么现场问题？</h1><form id="composer"><label class="sr-only" for="message-input">输入任务或补充消息</label><textarea id="message-input" rows="3" placeholder="描述你的 BF-AIoT 任务…" maxlength="12000"></textarea><div class="composer-actions"><button id="attach-file" type="button" class="quiet" aria-label="添加文字资料" title="添加 txt、md 或 json 资料">＋</button><input id="product-file-input" type="file" accept=".txt,.md,.json" hidden><span id="composer-state" class="muted">DeepSeek Flash</span><button id="stop-chat" type="button" class="quiet" hidden>停止</button><button id="send-message" type="submit" class="send-button" aria-label="发送消息">↑</button></div></form><section id="case-suggestions" aria-label="任务灵感"></section><div id="composer-notice" role="status"></div><p class="composer-hint" id="composer-hint">Enter 发送 · Shift + Enter 换行</p></div></section><section id="developer-view" hidden aria-label="控制台"><div class="dev-top"><div><h2>控制台</h2><p id="dev-session" class="muted">追溯一次运行，准备下一个版本。</p></div><button id="console-map" class="quiet">在全景中定位 ↗</button></div><div id="console-scope" class="console-scope"></div><nav id="dev-nav" aria-label="控制台分区"></nav><nav id="dev-subnav" aria-label="配置与能力"></nav><div id="dev-content" aria-live="polite"></div><section id="revision-panel"><div class="section-heading"><h2>下一次运行配置</h2><button id="new-revision">新建配置</button></div><p id="active-revision" class="muted"></p><div id="revision-list"></div></section></section><section id="panorama-view" hidden aria-label="系统全景"></section><section id="product-view" hidden aria-label="产品设计"></section><aside id="section-inspector" aria-label="方案与文件"><div class="inspector-heading">方案与文件<button id="close-sections" class="quiet" aria-label="收起方案与文件">×</button></div><nav id="section-tabs" aria-label="详情选择"><button data-section="model">产品</button><button data-section="proposal">方案</button><button data-section="files">文件</button><button data-section="deployment">部署</button></nav><div id="section-content"></div></aside></div></main></div><script src="/version.js"></script><script src="/conversation.js"></script><script src="/app.js"></script><script src="/trace.js"></script><script src="/eda.js"></script><script src="/references.js"></script><script src="/engineering.js"></script><script src="/panorama.js"></script><script src="/delivery.js"></script><script src="/research.js"></script><script src="/product-graph.js"></script><script src="/product-deliverables.js"></script><script src="/product-deliverables-view.js"></script><script src="/product-results.js"></script><script src="/product-workspace.js"></script><script src="/reference-case.js"></script>
<script src="/developer.js"></script><script src="/organization.js"></script><script src="/product.js"></script><script src="/cases.js"></script></body></html>
