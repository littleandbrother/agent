<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BF Agent Studio</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/developer.css"><link rel="stylesheet" href="/trace.css"><link rel="stylesheet" href="/chat.css"><link rel="stylesheet" href="/organization.css"><link rel="stylesheet" href="/product.css"><link rel="stylesheet" href="/conversation.css"><link rel="stylesheet" href="/console.css"><link rel="stylesheet" href="/panorama.css"><link rel="stylesheet" href="/research.css"><link rel="stylesheet" href="/product-workspace.css"><link rel="stylesheet" href="/product-results.css"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/engineering-workspace.css"><link rel="stylesheet" href="/product-evidence.css"><link rel="stylesheet" href="/runtime-scene/studio.css"><link rel="stylesheet" href="/runtime-studio.css"><link rel="stylesheet" href="/artifact-workspace.css"><link rel="stylesheet" href="/literature-learning.css"></head>
<body><div class="shell"><aside id="session-sidebar" class="sidebar" aria-label="会话侧栏"><a class="brand" href="/">bƒ <span>BF Agent <small id="workspace-name">Studio</small></span></a><div class="sidebar-create"><button id="new-chat" class="new-chat">新建项目</button><button id="new-folder" class="quiet" title="新建文件夹" aria-label="新建文件夹">⊞</button></div><label class="studio-project-search"><span class="sr-only">查找项目</span><input id="studio-project-search" type="search" placeholder="查找项目" autocomplete="off"></label><div class="sidebar-scroll"><div id="folder-tree" aria-label="文件夹"></div><nav id="sessions" aria-label="任务会话"></nav><details id="history-list"><summary>历史实验会话</summary><nav id="legacy-sessions" aria-label="历史会话"></nav></details></div><div class="sidebar-bottom"><div class="workspace-switch" aria-label="工作空间"><button id="studio-space" aria-pressed="true">Studio <small>设计与成果</small></button><button id="lab-space" aria-pressed="false">Lab <small>研究与开发</small></button></div><div class="mode-switch" aria-label="工作台模式"><button id="runtime-mode" aria-pressed="true">设计对话</button><button id="developer-mode" aria-pressed="false">控制台</button><button id="panorama-mode" aria-pressed="false">架构地图</button><button id="product-mode" aria-pressed="false">产品成果</button></div><button id="open-trash" class="quiet">最近删除</button><span id="connection">连接中</span><button id="refresh" class="quiet">刷新</button></div></aside>
<main><header class="topbar"><button id="sidebar-toggle" class="icon-button" aria-controls="session-sidebar" aria-expanded="true" aria-label="收起左侧栏" title="收起左侧栏">☰</button><span id="conversation-title">新对话</span><span id="conversation-status" class="muted"></span><button id="folder-context" class="quiet" hidden></button><button id="studio-results" class="quiet">查看产品</button><button id="studio-export" class="quiet" hidden>导出</button><button id="progress-toggle" class="quiet" aria-controls="execution-progress" aria-expanded="true">执行进展</button><button id="sections-toggle" class="quiet" aria-controls="section-inspector" aria-expanded="true">方案与文件</button></header><nav id="studio-project-tabs" aria-label="项目视图"><button data-studio-page="conversation" aria-current="page">对话</button><button data-studio-page="product">产品</button><button data-studio-page="delivery">交付</button></nav><div class="app-body"><section id="chat-main" class="chat-main is-empty"><div id="conversation" class="conversation" aria-label="任务对话" aria-live="polite"></div><div class="composer-wrap"><h1 id="welcome">你想做一个什么产品？</h1><form id="composer"><label class="sr-only" for="message-input">输入任务或补充消息</label><textarea id="message-input" rows="3" placeholder="描述你的 BF-AIoT 任务…" maxlength="12000"></textarea><div class="composer-actions"><button id="attach-file" type="button" class="quiet" aria-label="添加文字资料" title="添加 txt、md 或 json 资料">＋</button><input id="product-file-input" type="file" accept=".txt,.md,.json" hidden><span id="composer-state" class="muted">DeepSeek Flash</span><button id="stop-chat" type="button" class="quiet" hidden>停止</button><button id="send-message" type="submit" class="send-button" aria-label="发送消息">↑</button></div></form><section id="case-suggestions" aria-label="任务灵感"></section><div id="composer-notice" role="status"></div><p class="composer-hint" id="composer-hint">Enter 发送 · Shift + Enter 换行</p></div></section><aside id="execution-progress" aria-label="执行进展"><header class="xp-heading"><span><b>执行进展</b><small>任务 · 设计版本</small></span><button id="progress-refresh" class="quiet" aria-label="刷新执行进展" title="重新读取当前工程与检查">↻</button><button id="progress-close" class="quiet" aria-label="收起执行进展">‹</button></header><div id="progress-content" class="xp-scroll"><p class="xp-empty">选择一个项目，查看当前任务和设计版本。</p></div><footer class="xp-footer" id="progress-freshness" role="status">正在读取</footer></aside><section id="developer-view" hidden aria-label="控制台"><div class="dev-top"><div><h2>控制台</h2><p id="dev-session" class="muted">追溯一次运行，准备下一个版本。</p></div><button id="console-map" class="quiet">在全景中定位 ↗</button></div><div id="console-scope" class="console-scope"></div><nav id="dev-nav" aria-label="控制台分区"></nav><nav id="dev-subnav" aria-label="配置与能力"></nav><div id="dev-content" aria-live="polite"></div><section id="revision-panel"><div class="section-heading"><h2>下一次运行配置</h2><button id="new-revision">新建配置</button></div><p id="active-revision" class="muted"></p><div id="revision-list"></div></section></section><section id="panorama-view" hidden aria-label="系统全景"></section><section id="product-view" hidden aria-label="产品设计"></section><aside id="section-inspector" aria-label="方案与文件"><div class="inspector-heading">方案与文件<button id="close-sections" class="quiet" aria-label="收起方案与文件">×</button></div><nav id="section-tabs" aria-label="详情选择"><button data-section="model">产品</button><button data-section="proposal">方案</button><button data-section="files">文件</button><button data-section="deployment">部署</button></nav><div id="section-content"></div></aside></div></main></div><div id="runtime-studio-parking" hidden><section id="runtime-studio" hidden aria-label="Pi 运行动画"><div class="runtime-studio-heading"><span>Pi · 五个专业工作区</span><span class="runtime-studio-status" role="status"></span></div><div class="runtime-scene"></div><div class="runtime-studio-summary"></div><p class="runtime-studio-note">运行状态来自当前会话。屏幕与中央模型为视觉示意；工程验收以检查回执为准。</p></section></div><script src="/version.js"></script><script src="/conversation.js"></script><script src="/runtime-studio-model.js"></script><script src="/app.js"></script><script src="/result-catalog.js"></script><script src="/trace.js"></script><script src="/eda.js"></script><script src="/references.js"></script><script src="/engineering.js"></script><script src="/panorama.js"></script><script src="/delivery.js"></script><script src="/research.js"></script><script src="/product-graph.js"></script><script src="/product-deliverables.js"></script><script src="/product-deliverables-view.js"></script><script src="/product-evidence.js"></script><script src="/studio-model.js"></script><script src="/studio.js"></script><script src="/artifact-workspace.js"></script><script src="/product-results.js"></script><script src="/product-workspace.js"></script><script src="/reference-case.js"></script>
<script src="/literature-learning.js"></script><script src="/developer.js"></script><script src="/organization.js"></script><script src="/product.js"></script><script src="/cases.js"></script><script src="/engineering-workspace-model.js"></script><script src="/engineering-workspace.js"></script><script type="module" src="/runtime-studio.js"></script></body></html>
