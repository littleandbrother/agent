objective: Deliver the five user-authorized product milestones for a battery-free solar desktop companion using the existing Studio and Pi.
hypothesis: Source-bound parts, editable product geometry, native readback, versioned artifacts and delivery observation enable a coherent product to be built and revised through the existing tools.
falsifier: A required component is missing, native geometry cannot reopen, dependent results remain current after a physical change, or agent completion is declared without the required artifacts and checks.
