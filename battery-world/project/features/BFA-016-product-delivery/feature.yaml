handoff: All five bounded digital deliveries accepted. Independent Pi v12 baseline, v13 physical width change and v14 camera-only control passed with recorded coordinator feedback, not an unassisted trial. 300-test full verification passed; Chrome headless checked the live Studio; final 259-file aggregate package hashes and HTTP download passed. No hardware, manufacturing or RSI efficacy claim. Scientific gates unchanged. See docs/agentlab/PRODUCT-DELIVERY.json.
maintenance:
  objective: Repair request context overflow without deleting conversation history or changing product acceptance evidence.
  hypothesis: Content-addressed spill of oversized state and completed tool results allows long engineering sessions to continue within the existing request cap.
  falsifier: Replay still exceeds the cap for reducible data, instructions or user requirements change, tool exchanges become invalid, or archived content cannot be read back exactly.
  scope: Context projector, provider preflight, regression tests, context trace display and maintenance receipts within owned paths.
  negative_controls: Oversized user instructions and incomplete tool exchanges remain protected; preflight rejection must not create a billable request.
  command: Targeted context tests, full ./init.sh, archived-session replay and bounded live continuation.
  cost_cap: At most USD 0.10 additional diagnostic usage inside existing USD 10 global and USD .19 per-request caps; no budget changes.
  stop_condition: Unknown usage, inconsistent archives, or unrepresentable protected instructions stop dispatch.
  artifact: docs/agentlab/CONTEXT-OVERFLOW-REPAIR.md
  status: complete
  verification: 308 full Python tests, SDK and Studio checks-build-reproduction; 15 context and 16 trace targeted tests; actual Pi reply, real-provider historical replay and live browser Trace inspection.
  evidence: docs/agentlab/CONTEXT-OVERFLOW-REPAIR.json
wall_limit_repair:
  status: complete
  objective: Let interactive engineering turns outlive the obsolete 600-second process timer and pause recoverably at their real deadline.
  hypothesis: One explicit-user-turn lease shared by provider and process supervision prevents premature kills and honors new mid-turn messages.
  falsifier: A live lease is killed at 600 seconds, a background retry renews time, deadline shutdown loses resumability, or a paused task is labelled completed.
  scope: agentlab launcher, recovery, chat, Studio status text and their regression tests, with receipts inside existing owned paths.
  schema_changes: Additive wall-policy and shutdown observations in session receipts; PAUSED conversation state.
  tests: Advancing-clock process supervision past 600 seconds, new-message renewal, duplicate and recall negatives, graceful and forced shutdown, real Pi pause/resume with local fixture provider, full init.
  negative_controls: Scientific batch remains 600 seconds; expired/withdrawn leases cannot dispatch; USD and token limits remain enforced.
  command: Targeted launcher/recovery/chat tests and ./init.sh.
  artifact: docs/agentlab/SESSION-WALL-REPAIR.md
  cost_cap: Zero paid calls for repair verification; existing global and owner USD/token caps unchanged. New interactive user messages receive 1800 seconds; no retroactive renewal.
  claim_boundary: Engineering runtime correction only; no product, hardware, scientific or RSI completion inferred.
  stop_condition: Unknown billing, incorrect lease ownership, or non-reproducible shutdown state prevents dispatch or completion claims.
  verification: 316 full Python tests, SDK/Studio checks-build-reproduction; actual Pi with local fixture provider pauses and resumes the same saved session; live API and CUA checked. Final state follows drained exit events. Zero paid calls.
  evidence: docs/agentlab/SESSION-WALL-REPAIR.json
