cost_cap: Existing cumulative USD 10 and default owner USD 1 caps; user-authorized independent owner pi-chat-7bbf6862d7109e25 USD 5 cumulative, per request USD .19 retained. Recheck live readiness and remaining budget before real Pi calls. No purchases.
claim_boundary: Digital and engineering evidence are distinct from manufactured hardware. CAD, native EDA, firmware, independent Pi and human assistance are reported individually.
stop_condition: Preserve unresolved external operations and unknown usage. Missing physical assets remain incomplete; do not fabricate substitute acceptance or change frozen scientific semantics.
