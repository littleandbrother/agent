schema_changes:
  - Additive versioned product assembly, source-bound parts, artifacts and delivery observations; old proposal sessions remain readable.
tests:
  - Version identity and selective physical versus presentation freshness
  - Missing required parts, invalid dimensions, path and owner boundaries
  - Native Blender and CAD readback, model and preview identity
  - Energy conservation and startup/darkness/load boundary controls
  - Native EDA and target firmware build where available
  - Actual task page and bounded independent Pi revision
negative_controls:
  - Camera-only change cannot alter the physical budget
  - Missing or modified artifact cannot count as delivery
  - Required physical change cannot reuse stale verification
  - Model stop and operator-assisted work cannot count as autonomous completion
