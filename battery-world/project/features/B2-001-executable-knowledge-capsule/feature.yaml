hypothesis: An empirical action-load capsule can run outside its originating process and improve a fixed search driver's later design choices under the declared no-harvest burst scope.
falsifier: Capsule requires origin context; explanation error exceeds 0.08 V; a scoped admitted design browns out; controlled removal produces no probe-cost difference; or incompatible conditions are silently accepted.
schema_changes: [executable-knowledge-v1, reference-transfer-study-v1, knowledge-lifecycle-v1]
tests: [tests/knowledge/test_capsule.py]
negative_controls: [optimistic efficiency, capsule tamper, unqualified self-promotion, out-of-scope harvester, missing provenance, removal, independent repeats]
exit_gates: [detached execution, held-out explanation and use receipts, scoped qualification, lifecycle rejects and restrictions, cost ledger, synchronized source-to-reuse UI]
command: ./init.sh
artifacts: [docs/knowledge/reference-study.json, docs/knowledge/IMPLEMENTATION.md]
cost_cap: zero model/API calls; at most 100 local reference experiment executions per materialization
claim_boundary: Guided developer-authored reference study and classical fitted action model; not equal-history LLM efficacy, autonomous discovery, continual RSI or hardware transfer.
stop_condition: Explanation error, false admission, scope enforcement or identity checks fail; do not tune through the frozen qualification gate.
handoff: B1-002-single-agent-pilot
limitations: [model pilot remains pending, synthetic no-harvest burst domain, reference qualification is not research qualification, final confirmation data must be separately sealed]
integration_fix_scope: Normalize energy residual against nonzero stored/consumed energy when the new no-harvest test domain has zero harvested energy; no equations or physical thresholds change.
